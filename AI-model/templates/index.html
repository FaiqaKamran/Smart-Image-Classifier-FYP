<!DOCTYPE html>
<html>
<head>
    <title>Smart Agri - Crop Disease Detection</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e7d32;
            text-align: center;
        }
        .upload-box {
            border: 2px dashed #ccc;
            padding: 40px;
            margin: 20px 0;
            border-radius: 10px;
            text-align: center;
        }
        #imageInput {
            margin: 10px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            background: #f0f0f0;
            border-radius: 10px;
        }
        .detection {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .healthy {
            border-left: 5px solid #4CAF50;
        }
        .disease {
            border-left: 5px solid #f44336;
        }
        #preview {
            max-width: 300px;
            margin: 20px auto;
            display: none;
            border-radius: 10px;
        }
        .loading {
            display: none;
            color: #666;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Crop Disease Detection</h1>
        <p style="text-align: center;">Upload a leaf image to detect disease</p>
        
        <div class="upload-box">
            <input type="file" id="imageInput" accept="image/*">
            <br><br>
            <button onclick="predict()"> Detect Disease</button>
            <br><br>
            <img id="preview" alt="Preview">
            <div class="loading" id="loading"> Processing...</div>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        // Preview image
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const preview = document.getElementById('preview');
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        async function predict() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');
            const loading = document.getElementById('loading');
            
            if (!fileInput.files || fileInput.files.length === 0) {
                resultDiv.innerHTML = ' Please select an image first!';
                return;
            }
            
            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('image', file);
            
            loading.style.display = 'block';
            resultDiv.innerHTML = '';
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                
                if (data.error) {
                    resultDiv.innerHTML = `<div class="error"> Error: ${data.error}</div>`;
                    return;
                }
                
                if (data.detections.length === 0) {
                    resultDiv.innerHTML = '<div class="success"> No disease detected! Leaf is healthy.</div>';
                    return;
                }
                
                let html = '<h3> Results:</h3>';
                data.detections.forEach((det) => {
                    const isHealthy = det.class.toLowerCase().includes('healthy');
                    html += `
                        <div class="detection ${isHealthy ? 'healthy' : 'disease'}">
                            <strong>${det.class}</strong><br>
                            Confidence: ${det.confidence}%
                        </div>
                    `;
                });
                
                resultDiv.innerHTML = html;
                
            } catch (error) {
                loading.style.display = 'none';
                resultDiv.innerHTML = `<div class="error"> Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
